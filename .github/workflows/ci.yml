name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'pipeline[test]'
      - run: python -m tmo_pipeline validate
        working-directory: pipeline
      - run: python -m tmo_pipeline sources-md --check
        working-directory: pipeline
      - run: python -m pytest -q
        working-directory: pipeline

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run map-assets
      - run: npm run typecheck
      - run: npm test
