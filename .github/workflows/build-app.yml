name: Build Android app

# Builds a release APK and attaches it to the "app-latest" GitHub release.
# Install it on the phone from: https://github.com/Samsquanch-Bin/time-map-ontario/releases/tag/app-latest
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run map-assets
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      # Optional: sign with your own key if these repository secrets exist.
      # Without them the build uses Expo's standard signing key, which is the same
      # on every build, so updates still install over the previous version.
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.TMO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TMO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using release key from secrets"
          else
            echo "No TMO_KEYSTORE_BASE64 secret: using standard Expo signing"
          fi

      - name: Build release APK (arm64 only, for modern phones)
        working-directory: app/android
        env:
          TMO_KEYSTORE_PASSWORD: ${{ secrets.TMO_KEYSTORE_PASSWORD }}
          TMO_KEY_ALIAS: ${{ secrets.TMO_KEY_ALIAS }}
          TMO_KEY_PASSWORD: ${{ secrets.TMO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Check 16 KB page alignment of native libraries
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" | tail -3

      - name: Publish to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="time-map-ontario-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release view app-latest >/dev/null 2>&1 || \
            gh release create app-latest --title "App (latest build)" --notes "Install the .apk on your phone. Newest build is the highest number." --prerelease
          # keep only the newest APK on the release
          for old in $(gh release view app-latest --json assets --jq '.assets[].name' | grep '\.apk$' || true); do
            gh release delete-asset app-latest "$old" --yes
          done
          gh release upload app-latest "$NAME" --clobber
          echo "### APK: $NAME" >> "$GITHUB_STEP_SUMMARY"
