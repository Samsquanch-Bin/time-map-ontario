[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmo-pipeline"
version = "0.1.0"
description = "Builds the static data packs for Time Map Ontario (personal use)."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
  "requests>=2.31",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "shapely>=2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tmo_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
