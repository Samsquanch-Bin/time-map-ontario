attribution: "Historical topographic maps of Canada (1:63,360 and 1:25,000), digitized and georeferenced by the OCUL Historical Topographic Map Digitization Project; files from McMaster University Library"
used_for: [overlays]
terms_notes: >
  The project FAQ: "These maps are completely open access and in the public domain,
  you are free to adapt and re-use them in a publication of any medium. Please be sure
  to properly cite the maps, and acknowledge their source." Each overlay names its
  sheets, editions and years. The GeoTIFF links come from the project's own published
  collection list (scholarsportal/historical-topos, static/combined_namesort.json).
