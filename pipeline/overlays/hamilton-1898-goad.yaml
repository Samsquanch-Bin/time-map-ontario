description: "Chas. E. Goad's Insurance Plan of the City of Hamilton, Volume I, January 1898, at 1:600: every building with its construction (pink brick, yellow wood, blue stone), storeys, street numbers, shops, churches, hotels and factories. 44 of the 48 sheets are georeferenced here. Facsimile photographed from the British Library copy; McMaster University Library."
accuracy_note: "Georeferenced sheet by sheet for this app from 266 street corners matched to today's OpenStreetMap intersections; each sheet's corners fit within 0.4–3.2 m (typical 1.6 m). Parts of a sheet far from its nearest surviving street corner (e.g. the waterfront and where streets were renamed) may be off by more."
