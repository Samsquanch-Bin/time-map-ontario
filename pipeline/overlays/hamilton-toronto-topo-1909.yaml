description: "Federal one-inch-to-a-mile topographic maps (Hamilton, Brampton and Toronto sheets, 1909): roads, railways, villages, woods and rural houses drawn as dots, from Burlington through Oakville, Port Credit and Etobicoke to Toronto.\" Oakville, Port Credit and Etobicoke to Toronto.'"
accuracy_note: Georeferenced by the OCUL Historical Topographic Map Digitization Project; its error isn't published. One-inch-to-a-mile maps draw roads and houses as symbols, so expect them to sit within
  a few dozen metres of the real spot, not on it.
