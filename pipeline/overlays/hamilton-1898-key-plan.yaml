description: "Key plan of Hamilton, Volume I, January 1898, by Chas. E. Goad: every block of the old city coloured by building material (pink = brick, yellow = wooden, blue = stone) with the numbers of the detailed sheets. Facsimile photographed from the British Library copy; McMaster University Library."
accuracy_note: "Georeferenced for this app from 9 street corners matched to today's OpenStreetMap intersections with an affine fit. Streets renamed or moved since 1898 couldn't be used."
